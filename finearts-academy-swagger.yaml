openapi: 3.0.3
info:
  title: FineArts Academy API
  description: Complete API for FineArts Academy backend — covers admin auth, user/trainer/institute profiles, classes, payments, bookings, subscriptions, coupons, notifications, and dashboards.
  version: 1.0.0

servers:
  - url: http://localhost:5000/api
    description: Local development server

components:
  securitySchemes:
    FirebaseToken:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
      description: Firebase ID token for regular users, trainers, or institutes
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT token obtained from /admin-auth/login

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    AdminLoginRequest:
      type: object
      properties:
        email:
          type: string
          example: admin@finearts.com
        password:
          type: string
          example: Admin@123

    UserLoginRequest:
      type: object
      properties:
        role:
          type: string
          enum: [USER]

    UserProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Arjun Kumar
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        date_of_birth:
          type: string
          format: date
          example: "2000-05-15"
        city:
          type: string
          example: Chennai
        state:
          type: string
          example: Tamil Nadu
        country:
          type: string
          example: India
        pincode:
          type: string
          example: "600001"

    TrainerProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Priya Sharma
        bio:
          type: string
          example: Classical Bharatanatyam dancer with 10 years experience
        experience_years:
          type: integer
          example: 10
        email:
          type: string
          example: priya@example.com
        phone_number:
          type: string
          example: "+919876543210"
        profile_image:
          type: string
          example: https://example.com/priya.jpg
        certificate_url:
          type: string
          example: https://example.com/cert.pdf
        specializations:
          type: array
          items:
            type: object
            properties:
              category_id:
                type: integer
              subcategory_id:
                type: integer

    TrainerQRRequest:
      type: object
      properties:
        qr_image_url:
          type: string
          example: https://example.com/trainer-qr.png
        upi_id:
          type: string
          example: priya@upi

    InstituteProfileRequest:
      type: object
      properties:
        name:
          type: string
          example: Kalai Nilayam Fine Arts
        description:
          type: string
          example: Premier fine arts institute in Chennai
        email:
          type: string
          example: info@kalainilayam.com
        phone_number:
          type: string
          example: "+914412345678"
        address:
          type: string
          example: 12 Anna Salai
        city:
          type: string
          example: Chennai
        state:
          type: string
          example: Tamil Nadu
        pincode:
          type: string
          example: "600002"
        categories:
          type: array
          items:
            type: object
            properties:
              category_id:
                type: integer
              subcategory_id:
                type: integer

    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          example: Bharatanatyam
        description:
          type: string
          example: Classical Indian dance form
        image_url:
          type: string
          example: https://example.com/bharatanatyam.jpg

    SubcategoryRequest:
      type: object
      properties:
        name:
          type: string
          example: Beginner Bharatanatyam
        category_id:
          type: integer
          example: 1

    InstituteClassRequest:
      type: object
      properties:
        title:
          type: string
          example: Bharatanatyam for Beginners
        description:
          type: string
          example: Learn the basics of Bharatanatyam
        trainer_id:
          type: integer
          example: 1
        category_id:
          type: integer
          example: 1
        subcategory_id:
          type: integer
          example: 2
        price:
          type: number
          example: 1500
        duration:
          type: integer
          example: 60
        level:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        mode:
          type: string
          enum: [ONLINE, OFFLINE]
        max_students:
          type: integer
          example: 20
        schedule:
          type: object
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            start_time:
              type: string
              example: "09:00"
            end_time:
              type: string
              example: "10:00"
            days_of_week:
              type: string
              example: MON,WED,FRI

    TrainerClassRequest:
      type: object
      properties:
        title:
          type: string
          example: Online Carnatic Music
        description:
          type: string
          example: Learn Carnatic music from scratch
        category_id:
          type: integer
          example: 2
        price:
          type: number
          example: 800
        duration:
          type: integer
          example: 45
        level:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        mode:
          type: string
          enum: [ONLINE, OFFLINE]
        max_students:
          type: integer
          example: 10
        meeting_link:
          type: string
          example: https://meet.google.com/abc-xyz

    PaymentSubmitRequest:
      type: object
      properties:
        class_id:
          type: integer
          example: 1
        booking_type:
          type: string
          enum: [CLASS]
        amount:
          type: number
          example: 1500
        utr_number:
          type: string
          example: UTR123456789
        payment_screenshot:
          type: string
          example: https://example.com/screenshot.jpg
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        coupon_id:
          type: integer
          nullable: true
        discount_amount:
          type: number
          example: 0
        points_redeemed:
          type: integer
          example: 0
        points_discount:
          type: number
          example: 0

    BookingRequest:
      type: object
      properties:
        booking_type:
          type: string
          enum: [CLASS]
        class_id:
          type: integer
          example: 1
        amount:
          type: number
          example: 1500
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    SubscriptionPlanRequest:
      type: object
      properties:
        name:
          type: string
          example: Monthly Premium
        description:
          type: string
          example: Access all classes for 30 days
        price:
          type: number
          example: 999
        duration_days:
          type: integer
          example: 30
        plan_type:
          type: string
          enum: [USER, TRAINER, INSTITUTE]
        features:
          type: string
          example: Unlimited class views, Priority booking, 10% discount on all classes

    SubscribeRequest:
      type: object
      properties:
        plan_id:
          type: integer
          example: 1
        payment_id:
          type: string
          example: UTR_SUB_123456

    CouponRequest:
      type: object
      properties:
        code:
          type: string
          example: WELCOME20
        description:
          type: string
          example: 20% off on first booking
        discount_type:
          type: string
          enum: [PERCENT, FLAT]
        discount_value:
          type: number
          example: 20
        min_order_amount:
          type: number
          example: 500
        max_discount_amount:
          type: number
          example: 300
        usage_limit:
          type: integer
          example: 100
        valid_until:
          type: string
          format: date-time
          example: "2026-12-31T23:59:59"

    ValidateCouponRequest:
      type: object
      properties:
        code:
          type: string
          example: WELCOME20
        amount:
          type: number
          example: 1500

    RedeemPointsRequest:
      type: object
      properties:
        points:
          type: integer
          example: 50

    NotificationSendRequest:
      type: object
      properties:
        title:
          type: string
          example: Class Reminder
        message:
          type: string
          example: Your Bharatanatyam class starts in 1 hour
        target_account_id:
          type: integer
          example: 5

    RejectReasonRequest:
      type: object
      properties:
        reason:
          type: string
          example: Incomplete documentation provided

paths:

  # ─── 1. Admin Auth ────────────────────────────────────────────────────────────
  /admin-auth/login:
    post:
      tags: [1. Admin Auth]
      summary: Admin Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Admin logged in successfully

  # ─── 2. Auth (Firebase Users) ─────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [2. Auth (Firebase Users)]
      summary: Login / Register (User)
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: User logged in or registered

  /auth/me:
    get:
      tags: [2. Auth (Firebase Users)]
      summary: Get Me
      security:
        - FirebaseToken: []
      responses:
        '200':
          description: Current authenticated user info

  # ─── 3. User Profile ──────────────────────────────────────────────────────────
  /users/profile:
    post:
      tags: [3. User Profile]
      summary: Create / Update Profile
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      responses:
        '200':
          description: Profile created or updated
    get:
      tags: [3. User Profile]
      summary: Get My Profile
      security:
        - FirebaseToken: []
      responses:
        '200':
          description: User profile

  # ─── 4. Trainer ───────────────────────────────────────────────────────────────
  /trainers/login:
    post:
      tags: [4. Trainer]
      summary: Trainer Login (first time auto-creates account)
      security:
        - FirebaseToken: []
      responses:
        '200':
          description: Trainer logged in

  /trainers/complete-profile:
    put:
      tags: [4. Trainer]
      summary: Trainer Complete Profile
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainerProfileRequest'
      responses:
        '200':
          description: Profile completed

  /trainers/me/profile:
    get:
      tags: [4. Trainer]
      summary: Get My Trainer Profile
      security:
        - FirebaseToken: []
      responses:
        '200':
          description: Trainer profile

  /trainers/{id}:
    get:
      tags: [4. Trainer]
      summary: Get Trainer Public Profile (by ID)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Public trainer profile

  /trainers/me/qr:
    put:
      tags: [4. Trainer]
      summary: Update Trainer QR Code
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainerQRRequest'
      responses:
        '200':
          description: QR code updated

  /classes/trainer/apply-institute:
    post:
      tags: [4. Trainer]
      summary: Trainer Apply to Institute
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                institute_id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Application submitted

  # ─── 5. Institute ─────────────────────────────────────────────────────────────
  /institutes/login:
    post:
      tags: [5. Institute]
      summary: Institute Login (first time auto-creates account)
      security:
        - FirebaseToken: []
      responses:
        '200':
          description: Institute logged in

  /institutes/complete-profile:
    put:
      tags: [5. Institute]
      summary: Institute Complete Profile
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituteProfileRequest'
      responses:
        '200':
          description: Profile completed

  /institutes/profile:
    get:
      tags: [5. Institute]
      summary: Get Institute Profile
      security:
        - FirebaseToken: []
      responses:
        '200':
          description: Institute profile

  /institutes:
    get:
      tags: [5. Institute]
      summary: List All Institutes (Public)
      parameters:
        - name: city
          in: query
          schema:
            type: string
            example: Chennai
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: List of institutes

  /institutes/{id}/trainers:
    get:
      tags: [5. Institute]
      summary: Get Institute Trainers (Public)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: List of trainers for institute

  /classes/institute/add-trainer:
    post:
      tags: [5. Institute]
      summary: Institute Add Trainer Directly
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: Ravi Shankar
                phone_number:
                  type: string
                  example: "+919123456789"
                email:
                  type: string
                  example: ravi@example.com
                bio:
                  type: string
                  example: Carnatic music teacher
                experience_years:
                  type: integer
                  example: 8
                category_id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Trainer added

  /classes/institute/trainer-applications:
    get:
      tags: [5. Institute]
      summary: Institute View Trainer Applications
      security:
        - FirebaseToken: []
      responses:
        '200':
          description: List of trainer applications

  /classes/institute/trainer-applications/{id}:
    patch:
      tags: [5. Institute]
      summary: Institute Accept/Reject Trainer Application
      security:
        - FirebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [accept, reject]
      responses:
        '200':
          description: Application updated

  /institutes/trainers/{id}/approval:
    put:
      tags: [5. Institute]
      summary: Institute Update Trainer Approval Status
      security:
        - FirebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                reason:
                  type: string
      responses:
        '200':
          description: Approval status updated

  # ─── 6. Categories & Subcategories ───────────────────────────────────────────
  /categories:
    get:
      tags: [6. Categories & Subcategories]
      summary: List All Categories
      responses:
        '200':
          description: All categories
    post:
      tags: [6. Categories & Subcategories]
      summary: Create Category (Admin)
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created

  /categories/{id}:
    get:
      tags: [6. Categories & Subcategories]
      summary: Get Category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Category detail
    put:
      tags: [6. Categories & Subcategories]
      summary: Update Category (Admin)
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated
    delete:
      tags: [6. Categories & Subcategories]
      summary: Delete Category (Admin)
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Category deleted

  /subcategories:
    get:
      tags: [6. Categories & Subcategories]
      summary: List All Subcategories
      responses:
        '200':
          description: All subcategories
    post:
      tags: [6. Categories & Subcategories]
      summary: Create Subcategory (Admin)
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubcategoryRequest'
      responses:
        '201':
          description: Subcategory created

  /subcategories/category/{id}:
    get:
      tags: [6. Categories & Subcategories]
      summary: Get Subcategories by Category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Subcategories for the category

  # ─── 7. Classes ───────────────────────────────────────────────────────────────
  /classes:
    get:
      tags: [7. Classes]
      summary: List Classes (Public)
      parameters:
        - name: category_id
          in: query
          schema:
            type: integer
            example: 1
        - name: mode
          in: query
          schema:
            type: string
            enum: [ONLINE, OFFLINE]
        - name: level
          in: query
          schema:
            type: string
            enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          schema:
            type: integer
            example: 12
      responses:
        '200':
          description: List of classes

  /classes/{id}:
    get:
      tags: [7. Classes]
      summary: Get Class by ID (Public)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Class detail

  /classes/institute/create:
    post:
      tags: [7. Classes]
      summary: Institute Create Class
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituteClassRequest'
      responses:
        '201':
          description: Class created

  /classes/trainer/create:
    post:
      tags: [7. Classes]
      summary: Trainer Create Class
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainerClassRequest'
      responses:
        '201':
          description: Class created

  /classes/institute/{id}:
    put:
      tags: [7. Classes]
      summary: Update Class (Institute)
      security:
        - FirebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituteClassRequest'
      responses:
        '200':
          description: Class updated

  /classes/trainer/{id}:
    delete:
      tags: [7. Classes]
      summary: Delete Class (Trainer)
      security:
        - FirebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Class deleted

  # ─── 8. Payments ──────────────────────────────────────────────────────────────
  /payments/qr/{class_id}:
    get:
      tags: [8. Payments (QR Flow)]
      summary: Get QR Code + Amount for Class (Public)
      parameters:
        - name: class_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: QR code and amount info

  /payments/qr-settings:
    get:
      tags: [8. Payments (QR Flow)]
      summary: Get Platform QR Settings (Public)
      responses:
        '200':
          description: Platform QR settings

  /payments/submit:
    post:
      tags: [8. Payments (QR Flow)]
      summary: Submit Payment (User - after scanning QR)
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSubmitRequest'
      responses:
        '200':
          description: Payment submitted

  /payments/my:
    get:
      tags: [8. Payments (QR Flow)]
      summary: Get My Payments
      security:
        - FirebaseToken: []
      responses:
        '200':
          description: User payment history

  /payments/pending:
    get:
      tags: [8. Payments (QR Flow)]
      summary: Get Pending Payments (Admin/Institute)
      security:
        - FirebaseToken: []
      responses:
        '200':
          description: Pending payments list

  /payments/{id}/verify:
    patch:
      tags: [8. Payments (QR Flow)]
      summary: Verify Payment (Admin/Institute)
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Payment verified

  /payments/{id}/reject:
    patch:
      tags: [8. Payments (QR Flow)]
      summary: Reject Payment (Admin/Institute)
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectReasonRequest'
      responses:
        '200':
          description: Payment rejected

  # ─── 9. Bookings ──────────────────────────────────────────────────────────────
  /bookings:
    post:
      tags: [9. Bookings]
      summary: Create Booking
      security:
        - FirebaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Booking created

  /bookings/my:
    get:
      tags: [9. Bookings]
      summary: Get My Bookings
      security:
        - FirebaseToken: []
      responses:
        '200':
          description: User bookings

  /bookings/{id}:
    get:
      tags: [9. Bookings]
      summary: Get Booking by ID
      security:
        - FirebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Booking detail

  /bookings/{id}/cancel:
    patch:
      tags: [9. Bookings]
      summary: Cancel Booking
      security:
        - FirebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Booking cancelled

  /bookings/{id}/confirm:
    patch:
      tags: [9. Bookings]
      summary: Confirm Booking
      security:
        - FirebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Booking confirmed

  /bookings/{id}/complete:
    patch:
      tags: [9. Bookings]
      summary: Complete Booking
      security:
        - FirebaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
